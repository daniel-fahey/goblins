image: registry.gitlab.com/spritely/guile-goblins:latest

stages:
  - test
  - perf-tests

unit-tests:
  stage: test
  script:
    - sh ./bootstrap.sh
    - ./configure
    - make distcheck
    # Check we can build the HTML docs
    - make html

perf-tests:
  stage: perf-tests
  script:
    sh ./bootstrap.sh
    ./configure
    make
    ./pre-inst-env guile --no-auto-compile -e main misc/perf-tests.scm > perf-results.txt
  artifacts:
    expose_as: 'performance tests'
    paths: ['perf-results.txt']
